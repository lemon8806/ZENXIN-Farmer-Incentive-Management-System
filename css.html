<style>

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden;
    }

    body {
        background: linear-gradient(135deg, #1e272c 0%, #0f1418 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #ffffff;
        font-family: sans-serif;
    }

    section {
        height: 100%;
        display: flex;
        flex-direction: column;
        text-align: center;
        justify-content: center;
        align-items: center;
    }





    /*================================================================
        登录界面相关 
    ================================================================*/

    /*--------------------------------------------------------------- 
        表单容器 
    ---------------------------------------------------------------*/
    #loginContainer {
        width: 100%;
        max-width: 420px;
        background: rgba(30, 41, 44, 0.45);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        text-align: center;
    }





    /*---------------------------------------------------------------
        表单 Header (h2, p) 
    ---------------------------------------------------------------*/
    #loginHeader h2 {
        font-size: 24px;
        font-weight: 600;
        color: #2ecc71;
        /* 禅欣科技绿 */
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    #loginHeader p {
        font-size: 14px;
        color: #a0aec0;
        margin-bottom: 35px;
    }





    /*--------------------------------------------------------------- 
        表单输入 
    ---------------------------------------------------------------*/
    /* 调整 login 表单里的元素 (label, input) */
    .inputGroup {
        margin-bottom: 24px;
        text-align: left;
    }

    /* Login 表单的 input 的 label 美化 */
    .inputGroup label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #cbd5e0;
        margin-bottom: 8px;
    }

    /* 调整 login 表单的 input 的 position */
    .inputWrapper {
        position: relative;
    }

    /* Login 表单的 input 美化 */
    .inputWrapper input {
        width: 100%;
        background: rgba(15, 23, 25, 0.6);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 14px 16px;
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .inputWrapper input:focus {
        border-color: #2ecc71;
        box-shadow: 0 0 12px rgba(46, 204, 113, 0.25);
        background: rgba(15, 23, 25, 0.8);
    }

    /* 
        避免 login 表单的 input 
        在用户选择自动填充的时候
        被覆盖掉已设定好的背景颜色 
    */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {

        /* 强制文字颜色为白色 */
        -webkit-text-fill-color: #ffffff !important; 

        /* 用一个深色的内阴影 "假装" 是背景颜色 */
        -webkit-box-shadow: 0 0 0 30px #0f1719 inset !important; 

        /* 一个经典技巧，延迟浏览器默认样式的生效 */
        transition: background-color 5000s ease-in-out 0s; 
    }

    /* 表单提交按钮美化 */
    .btnLogin {
        width: 100%;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 15px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        margin-top: 10px;
        letter-spacing: 0.5px;
    }

    .btnLogin:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(46, 204, 113, 0.45);
        background: linear-gradient(135deg, #2fdd79 0%, #21994c 100%);
    }

    .btnLogin:active {
        transform: translateY(0);
    }





    /*--------------------------------------------------------------- 
        表单 footer 
    ---------------------------------------------------------------*/
    #loginFooter {
        margin-top: 30px;
        font-size: 11px;
        color: #718096;
        letter-spacing: 0.3px;
    }

</style>
