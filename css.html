<style>

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden;
    }

    body {
        background: linear-gradient(135deg, #1e272c 0%, #0f1418 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #ffffff;
        font-family: sans-serif;
    }

    section {
        height: 100%;
        display: flex;
        flex-direction: column;
        text-align: center;
        justify-content: center;
        align-items: center;
    }





    /*================================================================
        登录界面相关 
    ================================================================*/

    /*--------------------------------------------------------------- 
        表单容器 
    ---------------------------------------------------------------*/
    #loginContainer {
        width: 100%;
        max-width: 420px;
        background: rgba(30, 41, 44, 0.45);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        text-align: center;
    }





    /*---------------------------------------------------------------
        表单 Header (h2, p) 
    ---------------------------------------------------------------*/
    #loginHeader h2 {
        font-size: 24px;
        font-weight: 600;
        color: #2ecc71;
        /* 禅欣科技绿 */
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    #loginHeader p {
        font-size: 14px;
        color: #a0aec0;
        margin-bottom: 35px;
    }





    /*--------------------------------------------------------------- 
        表单输入 
    ---------------------------------------------------------------*/
    .inputGroup {
        margin-bottom: 24px;
        text-align: left;
    }

    /* label 美化 */
    .inputGroup label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #cbd5e0;
        margin-bottom: 8px;
    }

    /* Textbox */
    .inputWrapper {
        position: relative;
    }

    /* Textbox 美化 */
    .inputWrapper input {
        width: 100%;
        background: rgba(15, 23, 25, 0.6);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 14px 16px;
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .inputWrapper input:focus {
        border-color: #2ecc71;
        box-shadow: 0 0 12px rgba(46, 204, 113, 0.25);
        background: rgba(15, 23, 25, 0.8);
    }

    /* 表单提交按钮美化 */
    .btnLogin {
        width: 100%;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 15px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        margin-top: 10px;
        letter-spacing: 0.5px;
    }

    .btnLogin:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(46, 204, 113, 0.45);
        background: linear-gradient(135deg, #2fdd79 0%, #21994c 100%);
    }

    .btnLogin:active {
        transform: translateY(0);
    }





    /*--------------------------------------------------------------- 
        表单 footer 
    ---------------------------------------------------------------*/
    #loginFooter {
        margin-top: 30px;
        font-size: 11px;
        color: #718096;
        letter-spacing: 0.3px;
    }

</style>
