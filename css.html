<style>

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;

        /* 设置一个纯色深邃底色 */
        background-color: #0f1418; 

        /* 使用内联 SVG 作为鼠标指针，无需外部图片文件 */
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 256 256'><path fill='%232ecc71' d='M208.49 199.51a12 12 0 0 1-17 17l-42.06-42.07a88.18 88.18 0 0 1-52.22 16.31a88 88 0 0 1-62.22-150.22a88.18 88.18 0 0 1 16.31-52.22L93.51 29.51a12 12 0 0 1 17-17L208.49 110.49ZM156 92a64 64 0 0 0-56.57 96.57L196 92Z'/></svg>") 16 16, auto;
    }

    section {
        height: 100%;
        display: flex;
        flex-direction: column;
        text-align: center;
        justify-content: center;
        align-items: center;
    }





    /*================================================================
        鼠标特效相关 
    ================================================================*/

    #trailCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        /* 放在最顶层作为背景 */
        z-index: 1; 
    }





    /*================================================================
        登录界面相关 
    ================================================================*/

    /*--------------------------------------------------------------- 
        表单容器 
    ---------------------------------------------------------------*/
    #loginContainer {
        position: relative;
        width: 100%;
        max-width: 420px;
        background: rgba(18, 25, 28, 0.65); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 40px 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        text-align: center;
        transition: all 0.4s ease;

        /* 确保它在画板的上面 */
        z-index: 10; 
    }

    #loginContainer:hover {
        border-color: rgba(46, 204, 113, 0.45);
        box-shadow: 0 25px 60px rgba(46, 204, 113, 0.15);
    }





    /*---------------------------------------------------------------
        表单 Header (h2, p) 
    ---------------------------------------------------------------*/
    #loginHeader h2 {
        font-size: 24px;
        font-weight: 600;
        color: #2ecc71;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    #loginHeader p {
        font-size: 14px;
        color: #a0aec0;
        margin-bottom: 35px;
    }





    /*--------------------------------------------------------------- 
        表单输入 (label, input, button)
    ---------------------------------------------------------------*/
    /* 调整 login 表单里的元素 (label, input) */
    .inputGroup {
        margin-bottom: 24px;
        text-align: left;
    }

    /* Login 表单的 input 的 label 美化 */
    .inputGroup label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #cbd5e0;
        margin-bottom: 8px;
    }

    /* 调整 login 表单的 input 的 position */
    .inputWrapper {
        position: relative;
    }

    /* Login 表单的 input 美化 */
    .inputWrapper input {
        width: 100%;
        background: rgba(15, 23, 25, 0.6);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 14px 16px;
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;

        /* 让所有变化都在 0.3 秒内平滑过渡 */
        transition: all 0.3s ease;
    }

    .inputWrapper input:hover {
        border-color: rgba(46, 204, 113, 0.5); 
        box-shadow: 0 0 15px rgba(46, 204, 113, 0.2); 
    }

    .inputWrapper input:focus {
        border-color: #2ecc71;
        box-shadow: 0 0 25px rgba(46, 204, 113, 0.45); 
        background: rgba(10, 15, 18, 0.85);
    }

    /* 
        避免 login 表单的 input 
        在用户选择自动填充的时候
        被覆盖掉已设定好的背景颜色 
    */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {

        /* 强制文字颜色为白色 */
        -webkit-text-fill-color: #ffffff !important; 

        /* 用一个深色的内阴影 "假装" 是背景颜色 */
        -webkit-box-shadow: 0 0 0 30px #0f1719 inset !important; 

        /* 一个经典技巧，延迟浏览器默认样式的生效 */
        transition: background-color 5000s ease-in-out 0s; 
    }

    /* 表单提交按钮美化 */
    .btnLogin {
        width: 100%;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 15px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        margin-top: 10px;
        letter-spacing: 0.5px;
    }

    .btnLogin:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(46, 204, 113, 0.45);
        background: linear-gradient(135deg, #2fdd79 0%, #21994c 100%);
    }

    .btnLogin:active {
        transform: translateY(0);
    }





    /*--------------------------------------------------------------- 
        表单 footer 
    ---------------------------------------------------------------*/
    #loginFooter {
        margin-top: 30px;
        font-size: 11px;
        color: #718096;
        letter-spacing: 0.3px;
    }

</style>
